<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANON // SECURE CHANNEL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cinzel:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  :root{
    --black:#0a0a0a; --dark:#141414; --panel:#1c1c1c; --gray:#2e2e2e;
    --midgray:#4a4a4a; --lightgray:#8a8a8a; --silver:#c4c4c4;
    --white:#e8e8e8; --danger:#6b0f0f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--black);color:var(--silver);
    font-family:'Share Tech Mono', monospace;overflow-x:hidden;}
  body::before{content:"";position:fixed;inset:0;
    background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);
    background-size:40px 40px;pointer-events:none;z-index:0;}
  body::after{content:"";position:fixed;inset:0;
    background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.85) 100%);
    pointer-events:none;z-index:1;}
  .wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;
    padding:24px 18px 60px;}

  header{text-align:center;border:1px solid var(--gray);
    background:linear-gradient(180deg,var(--dark),var(--panel));
    padding:26px 16px 20px;margin-bottom:22px;position:relative;
    box-shadow:0 0 0 1px var(--black),0 10px 40px rgba(0,0,0,0.9) inset;}
  header::before,header::after{content:"";position:absolute;width:14px;height:14px;
    border:2px solid var(--midgray);}
  header::before{top:-2px;left:-2px;border-right:none;border-bottom:none;}
  header::after{bottom:-2px;right:-2px;border-left:none;border-top:none;}
  h1{font-family:'UnifrakturCook',cursive;font-size:clamp(30px,7vw,54px);
    color:var(--white);letter-spacing:2px;line-height:1;
    text-shadow:0 0 18px rgba(255,255,255,0.12),0 2px 0 var(--black);}
  .subtitle{font-family:'Cinzel',serif;font-size:clamp(10px,2.4vw,13px);
    letter-spacing:6px;color:var(--lightgray);text-transform:uppercase;margin-top:12px;}
  .status-bar{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;
    margin-top:16px;font-size:11px;color:var(--midgray);letter-spacing:2px;}
  .status-bar span{display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--lightgray);
    box-shadow:0 0 8px var(--lightgray);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}

  .panel{border:1px solid var(--gray);
    background:linear-gradient(180deg,var(--dark),var(--panel));
    padding:20px;margin-bottom:20px;position:relative;}
  .panel-title{font-family:'Cinzel',serif;font-size:13px;letter-spacing:4px;
    text-transform:uppercase;color:var(--silver);margin-bottom:16px;
    padding-bottom:10px;border-bottom:1px solid var(--gray);
    display:flex;align-items:center;gap:10px;}
  .panel-title::before{content:"◆";color:var(--midgray);font-size:10px;}

  label{display:block;font-size:11px;letter-spacing:2px;color:var(--lightgray);
    text-transform:uppercase;margin-bottom:6px;}
  input,textarea,select{width:100%;background:var(--black);border:1px solid var(--gray);
    color:var(--white);font-family:'Share Tech Mono',monospace;font-size:14px;
    padding:12px;outline:none;transition:border-color .2s,box-shadow .2s;resize:vertical;}
  input:focus,textarea:focus,select:focus{border-color:var(--lightgray);
    box-shadow:0 0 0 1px var(--midgray),0 0 14px rgba(255,255,255,0.05);}
  textarea{min-height:90px;}
  .field{margin-bottom:16px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row .field{flex:1;min-width:180px;}

  button{font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;
    text-transform:uppercase;background:var(--gray);color:var(--white);
    border:1px solid var(--midgray);padding:13px 26px;cursor:pointer;
    transition:all .18s;position:relative;}
  button:hover{background:var(--midgray);color:var(--black);
    box-shadow:0 0 18px rgba(255,255,255,0.15);}
  button:active{transform:translateY(1px);}
  button.danger{background:var(--danger);border-color:#8a1a1a;}
  button.danger:hover{background:#8a1a1a;color:var(--white);}
  button.small{padding:8px 14px;font-size:10px;letter-spacing:2px;}
  button:disabled{opacity:0.4;cursor:not-allowed;}

  /* ===== СЕТКА ЧАТА ===== */
  .chat-layout{display:grid;grid-template-columns:260px 1fr;gap:20px;}
  @media(max-width:820px){.chat-layout{grid-template-columns:1fr;}}

  /* Список участников */
  .peers{max-height:520px;overflow-y:auto;}
  .peer{display:flex;align-items:center;gap:10px;padding:10px 12px;
    border:1px solid var(--gray);background:var(--black);margin-bottom:8px;
    cursor:pointer;transition:all .15s;font-size:13px;}
  .peer:hover{border-color:var(--midgray);background:var(--dark);}
  .peer.active{border-color:var(--white);background:var(--gray);}
  .peer .avatar{width:28px;height:28px;flex:0 0 28px;display:flex;
    align-items:center;justify-content:center;background:var(--gray);
    border:1px solid var(--midgray);font-family:'Cinzel',serif;
    font-size:13px;color:var(--white);}
  .peer .info{flex:1;min-width:0;}
  .peer .name{color:var(--white);font-weight:700;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .peer .sub{font-size:9px;color:var(--midgray);letter-spacing:1px;}
  .peer .pdot{width:7px;height:7px;border-radius:50%;background:var(--lightgray);
    box-shadow:0 0 6px var(--lightgray);}
  .peer.offline .pdot{background:var(--midgray);box-shadow:none;}

  /* Окно чата */
  .chat-box{display:flex;flex-direction:column;height:560px;
    border:1px solid var(--gray);background:var(--black);}
  .chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;
    border-bottom:1px solid var(--gray);
    background:linear-gradient(180deg,var(--dark),var(--panel));}
  .chat-head .title{font-family:'Cinzel',serif;font-size:12px;
    letter-spacing:3px;color:var(--white);text-transform:uppercase;}
  .chat-head .hint{font-size:10px;color:var(--midgray);letter-spacing:1px;
    margin-left:auto;text-transform:uppercase;}
  .messages{flex:1;overflow-y:auto;padding:16px;display:flex;
    flex-direction:column;gap:10px;}
  .msg{max-width:78%;padding:10px 12px;border:1px solid var(--gray);
    background:var(--dark);font-size:13px;line-height:1.5;
    animation:fadeIn .25s ease;word-break:break-word;}
  .msg .meta{display:flex;justify-content:space-between;gap:10px;
    font-size:9px;letter-spacing:1px;color:var(--midgray);
    margin-bottom:5px;text-transform:uppercase;}
  .msg.own{align-self:flex-end;background:var(--gray);border-color:var(--midgray);}
  .msg.own .meta{color:var(--lightgray);}
  .msg.sys{align-self:center;background:transparent;border:none;
    color:var(--midgray);font-size:10px;letter-spacing:2px;text-align:center;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .composer{display:flex;gap:10px;padding:12px;border-top:1px solid var(--gray);
    background:var(--panel);}
  .composer input{flex:1;}

  .empty{text-align:center;color:var(--midgray);font-size:12px;
    letter-spacing:2px;padding:26px;border:1px dashed var(--gray);}

  footer{text-align:center;margin-top:30px;font-size:10px;
    letter-spacing:2px;color:var(--midgray);line-height:2;}
  footer .gothic{font-family:'UnifrakturCook',cursive;font-size:20px;
    color:var(--midgray);letter-spacing:1px;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:var(--black);}
  ::-webkit-scrollbar-thumb{background:var(--gray);border:1px solid var(--midgray);}
  ::-webkit-scrollbar-thumb:hover{background:var(--midgray);}

  /* Модальное окно входа */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal.hidden{display:none;}
  .modal-card{border:1px solid var(--midgray);
    background:linear-gradient(180deg,var(--dark),var(--panel));
    padding:30px;max-width:420px;width:100%;position:relative;
    box-shadow:0 0 60px rgba(255,255,255,0.08);}
  .modal-card h2{font-family:'UnifrakturCook',cursive;font-size:32px;
    color:var(--white);text-align:center;margin-bottom:8px;}
  .modal-card .sub{text-align:center;font-size:10px;letter-spacing:3px;
    color:var(--midgray);text-transform:uppercase;margin-bottom:24px;}
  .modal-card input{margin-bottom:16px;text-align:center;font-size:16px;}
  .modal-card button{width:100%;}

  @media(max-width:600px){
    .panel{padding:16px 14px;}
    .chat-box{height:480px;}
  }
</style>
</head>
<body>

<!-- МОДАЛКА ВХОДА -->
<div class="modal" id="loginModal">
  <div class="modal-card">
    <h2>Anon Transmission</h2>
    <div class="sub">Выберите позывной</div>
    <input type="text" id="loginName" maxlength="18" placeholder="ПРИЗРАК-07" autocomplete="off">
    <button id="loginBtn">Войти в канал</button>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>Anon Transmission</h1>
    <div class="subtitle">Secure &middot; Anonymous &middot; Shared</div>
    <div class="status-bar">
      <span><i class="dot"></i> <span id="stConn">CONNECTING</span></span>
      <span><i class="dot"></i> <span id="stMe">—</span></span>
      <span><i class="dot"></i> <span id="stPeers">0 ONLINE</span></span>
    </div>
  </header>

  <div class="chat-layout">
    <!-- ПАНЕЛЬ УЧАСТНИКОВ -->
    <section class="panel">
      <div class="panel-title">Участники сети</div>
      <div class="peers" id="peersList">
        <div class="peer active" data-peer="general">
          <div class="avatar">◈</div>
          <div class="info">
            <div class="name">ОБЩИЙ КАНАЛ</div>
            <div class="sub">все участники</div>
          </div>
          <div class="pdot"></div>
        </div>
      </div>
    </section>

    <!-- ЧАТ -->
    <section class="panel" style="padding:0;border:none;background:none;">
      <div class="chat-box">
        <div class="chat-head">
          <div class="title" id="chatTitle">ОБЩИЙ КАНАЛ</div>
          <div class="hint" id="chatHint">LIVE</div>
        </div>
        <div class="messages" id="messages">
          <div class="empty">Выберите собеседника или пишите в общий канал</div>
        </div>
        <form class="composer" id="composer">
          <input type="text" id="msgInput" maxlength="1500"
                 placeholder="Сообщение..." autocomplete="off" disabled>
          <button type="submit" id="sendBtn" disabled>➤</button>
        </form>
      </div>
    </section>
  </div>

  <footer>
    <div class="gothic">Memento Mori</div>
    <div>Сообщения синхронизируются через Firebase Realtime DB.</div>
  </footer>
</div>

<!-- FIREBASE SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, push, onChildAdded, onValue,
  set, remove, onDisconnect, serverTimestamp, query, limitToLast
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ============================================================
   ⚠️ ВСТАВЬТЕ СЮДА СВОЙ firebaseConfig
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyClu8d3HZs6vwPIi0wFHctsV4smmMEjqGw",
  authDomain: "legion1161-26d25.firebaseapp.com",
  databaseURL: "https://legion1161-26d25-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "legion1161-26d25",
  storageBucket: "legion1161-26d25.firebasestorage.app",
  messagingSenderId: "492849156809",
  appId: "1:492849156809:web:0c80db2d967b7bd78c3318"
};
/* ============================================================ */

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* ---------------- состояние ---------------- */
const state = {
  me: null,              // {id, name}
  peer: 'general',       // 'general' или peerId
  peers: {},             // id -> {name, online}
  listeners: [],         // отписки от onChildAdded
};

/* ---------------- DOM ---------------- */
const $ = id => document.getElementById(id);
const loginModal = $('loginModal');
const loginName  = $('loginName');
const loginBtn   = $('loginBtn');
const peersList  = $('peersList');
const messagesEl = $('messages');
const chatTitle  = $('chatTitle');
const chatHint   = $('chatHint');
const composer   = $('composer');
const msgInput   = $('msgInput');
const sendBtn    = $('sendBtn');
const stConn     = $('stConn');
const stMe       = $('stMe');
const stPeers    = $('stPeers');

/* ---------------- утилиты ---------------- */
const esc = s => String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const now = () => Date.now();
const pad = n => String(n).padStart(2,'0');
const fmtTime = ts => {
  const d = new Date(ts);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
// Ключ канала между двумя пользователями (детерминированный)
const dmKey = (a,b) => [a,b].sort().join('__');

/* ---------------- вход ---------------- */
loginBtn.addEventListener('click', doLogin);
loginName.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

function doLogin(){
  const name = loginName.value.trim() || 'АНОНИМ-' + Math.floor(Math.random()*999);
  const id = crypto.randomUUID ? crypto.randomUUID() : String(now()) + Math.random();

  state.me = { id, name };

  // Регистрируем себя в /peers
  const myRef = ref(db, 'peers/' + id);
  set(myRef, { name, online: true, ts: serverTimestamp() });
  onDisconnect(myRef).update({ online: false, ts: serverTimestamp() });

  stMe.textContent = name;
  loginModal.classList.add('hidden');

  listenPeers();
  listenGeneral();
  openChannel('general');
}

/* ---------------- участники ---------------- */
function listenPeers(){
  const peersRef = ref(db, 'peers');
  onValue(peersRef, snap => {
    const data = snap.val() || {};
    state.peers = data;

    // Определяем онлайн (свежие < 60 сек)
    const online = Object.entries(data).filter(([id, p]) =>
      id !== state.me.id && p.online && (now() - (p.ts || 0) < 60000)
    );

    stPeers.textContent = (online.length + 1) + ' ONLINE';
    stConn.textContent = 'CONNECTED';
    renderPeers(online);
  });
}

function renderPeers(online){
  // Сохраняем общий канал
  const items = [
    `<div class="peer ${state.peer==='general'?'active':''}" data-peer="general">
       <div class="avatar">◈</div>
       <div class="info">
         <div class="name">ОБЩИЙ КАНАЛ</div>
         <div class="sub">все участники</div>
       </div>
       <div class="pdot"></div>
     </div>`
  ];

  online.forEach(([id, p]) => {
    const initial = (p.name || '?').trim().charAt(0).toUpperCase();
    items.push(`
      <div class="peer ${state.peer===id?'active':''}" data-peer="${esc(id)}">
        <div class="avatar">${esc(initial)}</div>
        <div class="info">
          <div class="name">${esc(p.name)}</div>
          <div class="sub">личный канал</div>
        </div>
        <div class="pdot"></div>
      </div>`);
  });

  peersList.innerHTML = items.join('');

  // Клики по собеседникам
  peersList.querySelectorAll('.peer').forEach(el => {
    el.addEventListener('click', () => openChannel(el.dataset.peer));
  });
}

/* ---------------- открытие канала ---------------- */
function openChannel(peerId){
  state.peer = peerId;
  // Подсветка активного
  peersList.querySelectorAll('.peer').forEach(el => {
    el.classList.toggle('active', el.dataset.peer === peerId);
  });

  if(peerId === 'general'){
    chatTitle.textContent = 'ОБЩИЙ КАНАЛ';
    chatHint.textContent  = 'LIVE';
  } else {
    const p = state.peers[peerId];
    chatTitle.textContent = 'ЛИЧНЫЙ КАНАЛ: ' + (p ? p.name : '???');
    chatHint.textContent  = 'SECURE';
  }

  msgInput.disabled = false;
  sendBtn.disabled  = false;

  listenMessages(peerId);
  msgInput.focus();
}

/* ---------------- сообщения ---------------- */
function listenMessages(peerId){
  // Отписываемся от прошлых
  state.listeners.forEach(unsub => unsub());
  state.listeners = [];
  messagesEl.innerHTML = '<div class="empty">Загрузка канала...</div>';

  let path;
  if(peerId === 'general') path = 'messages/general';
  else path = 'messages/dm/' + dmKey(state.me.id, peerId);

  const msgRef = query(ref(db, path), limitToLast(200));

  const unsub = onChildAdded(msgRef, snap => {
    const m = snap.val();
    if(!m) return;
    appendMessage(m);
  });

  state.listeners.push(unsub);

  // Очистка placeholder при первом сообщении
  const obs = new MutationObserver(() => {
    if(messagesEl.querySelector('.msg')) obs.disconnect();
    else if(messagesEl.querySelector('.empty')) {
      messagesEl.innerHTML = '<div class="empty">Пока нет сообщений</div>';
    }
  });
  obs.observe(messagesEl, {childList:true});
}

function appendMessage(m){
  // Убираем "Загрузка/пусто" при первом сообщении
  const empty = messagesEl.querySelector('.empty');
  if(empty) empty.remove();

  const own = m.uid === state.me.id;
  const el = document.createElement('div');
  el.className = 'msg' + (own ? ' own' : '');
  el.innerHTML = `
    <div class="meta">
      <span>${esc(m.name || 'АНОНИМ')}</span>
      <span>${fmtTime(m.ts || now())}</span>
    </div>
    <div>${esc(m.text).replace(/\n/g,'<br>')}</div>`;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* ---------------- отправка ---------------- */
composer.addEventListener('submit', e => {
  e.preventDefault();
  const text = msgInput.value.trim();
  if(!text || !state.me) return;

  let path;
  if(state.peer === 'general') path = 'messages/general';
  else path = 'messages/dm/' + dmKey(state.me.id, state.peer);

  push(ref(db, path), {
    uid: state.me.id,
    name: state.me.name,
    text,
    ts: now()
  });

  msgInput.value = '';
  msgInput.focus();
});

/* ---------------- общий канал стартует сразу ---------------- */
function listenGeneral(){ /* канал уже слушается через openChannel('general') */ }
</script>
</body>
</html>
